<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>ModWalletDiary · 钱包日记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%236366f1'/%3E%3Cpath d='M12 17a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4z' fill='%23fff'/%3E%3Cpath d='M32 22h6v6h-6a3 3 0 0 1 0-6z' fill='%23a5b4fc'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== 解锁 / 首次设置 ==================== -->
<div id="auth" class="auth">
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-card" id="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" width="64" height="64">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/>
        </linearGradient></defs>
        <rect width="48" height="48" rx="13" fill="url(#lg)"/>
        <path d="M12 17a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4z" fill="#fff"/>
        <path d="M32 22h6v6h-6a3 3 0 0 1 0-6z" fill="#c7d2fe"/>
        <circle cx="32.5" cy="25" r="1.4" fill="#4f46e5"/>
      </svg>
    </div>
    <h1 class="auth-title">ModWalletDiary</h1>
    <p class="auth-sub">离线记账本 · AES 加密 · 本地存储</p>

    <div id="auth-setup" hidden>
      <p class="auth-tip">首次使用，请设置解锁密码<br><small>密码用于加密你的所有数据，请务必牢记</small></p>
      <input type="password" id="setup-pw1" placeholder="设置密码（至少4位）" autocomplete="new-password">
      <input type="password" id="setup-pw2" placeholder="再次输入密码" autocomplete="new-password">
      <button id="setup-btn" class="btn-primary btn-block">创建我的账本</button>
    </div>

    <div id="auth-login" hidden>
      <p class="auth-tip">请输入密码解锁账本</p>
      <input type="password" id="login-pw" placeholder="输入密码" autocomplete="current-password">
      <button id="login-btn" class="btn-primary btn-block">解 锁</button>
    </div>

    <p id="auth-err" class="auth-err"></p>
  </div>
</div>

<!-- ==================== 主应用 ==================== -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="side-head">
      <span class="app-logo-sm" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
          </linearGradient></defs>
          <rect width="48" height="48" rx="13" fill="url(#lg2)"/>
          <path d="M12 17a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4z" fill="#fff"/>
          <path d="M32 22h6v6h-6a3 3 0 0 1 0-6z" fill="#c7d2fe"/>
          <circle cx="32.5" cy="25" r="1.4" fill="#4f46e5"/>
        </svg>
      </span>
      <span class="app-title-txt txt">钱包日记<small>ModWalletDiary</small></span>
      <button id="collapse-btn" class="collapse-btn txt" title="收起菜单">«</button>
    </div>
    <nav id="nav">
      <a href="javascript:;" data-page="dashboard" class="nav-item active" title="仪表盘">
        <span class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        <span class="txt">仪表盘</span>
      </a>
      <a href="javascript:;" data-page="record" class="nav-item" title="我要记账">
        <span class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
        <span class="txt">我要记账</span>
      </a>
      <a href="javascript:;" data-page="names" class="nav-item" title="款项名目">
        <span class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
        <span class="txt">款项名目</span>
      </a>
      <a href="javascript:;" data-page="tools" class="nav-item" title="支付工具">
        <span class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/></svg></span>
        <span class="txt">支付工具</span>
      </a>
      <a href="javascript:;" data-page="stats" class="nav-item" title="统计">
        <span class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V10"/><path d="M12 20V4"/><path d="M18 20v-7"/></svg></span>
        <span class="txt">统计</span>
      </a>
      <a href="javascript:;" data-page="manage" class="nav-item" title="管理">
        <span class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-6"/><path d="M4 11V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-4"/><path d="M20 13V3"/><circle cx="4" cy="13" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="20" cy="15" r="2"/></svg></span>
        <span class="txt">管理</span>
      </a>
    </nav>
    <div class="side-foot">
      <a href="javascript:;" id="lock-btn" class="nav-item" title="锁定">
        <span class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
        <span class="txt">锁定</span>
      </a>
    </div>
  </aside>
  <div id="mask"></div>

  <main id="main">
    <header id="topbar">
      <button id="menu-btn" title="菜单">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
      </button>
      <span id="page-title">仪表盘</span>
      <span id="page-date"></span>
    </header>

    <div id="pages">
      <section id="page-dashboard" class="page"></section>
      <section id="page-record" class="page" hidden></section>
      <section id="page-names" class="page" hidden></section>
      <section id="page-tools" class="page" hidden></section>
      <section id="page-stats" class="page" hidden></section>
      <section id="page-manage" class="page" hidden></section>
    </div>
  </main>
</div>

<div id="toast" hidden></div>
<div id="modal-overlay" hidden>
  <div id="modal" role="dialog"></div>
</div>

<script src="lib/crypto-js.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<script src="js/brand-icons.js"></script>
<script src="js/icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/record.js"></script>
<script src="js/names.js"></script>
<script src="js/tools.js"></script>
<script src="js/stats.js"></script>
<script src="js/manage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
