<!DOCTYPE html>
<html lang="zh-CN" class="app-shell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>ModWalletDiary · 钱包日记</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 解锁 / 首次设置 -->
<div id="auth" class="auth">
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-card" id="auth-card">
    <div class="auth-logo" data-icon="logo-auth"></div>
    <h1 class="auth-title">ModWalletDiary</h1>
    <p class="auth-appname">钱包日记</p>
    <p class="auth-sub">离线记账本 · AES 加密 · 本地存储</p>

    <div id="setup-panel" hidden>
      <p class="auth-tip">首次使用，请设置解锁密码<br><small>密码用于加密你的所有数据，请务必牢记</small></p>
      <input type="password" id="setup-pwd" placeholder="设置密码（至少4位）" autocomplete="new-password">
      <input type="password" id="setup-pwd-confirm" placeholder="再次输入密码" autocomplete="new-password">
      <button id="setup-btn" class="btn-primary btn-block">创建我的账本</button>
    </div>

    <div id="login-panel" hidden>
      <p class="auth-tip">请输入密码解锁账本</p>
      <input type="password" id="login-pwd" placeholder="输入密码" autocomplete="current-password">
      <button id="login-btn" class="btn-primary btn-block">解 锁</button>
    </div>

    <p id="auth-error" class="auth-err"></p>
  </div>
</div>

<!-- 主应用 -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo" aria-hidden="true" data-icon="logo-side"></span>
      <span class="sidebar-title side-label">钱包日记<small>ModWalletDiary</small></span>
      <button id="sidebar-collapse" class="sidebar-collapse side-label" title="收起菜单">«</button>
    </div>

    <!-- 导航即页面清单：data-page 对应 #pages 里的同名 section，标题取菜单文字 -->
    <nav id="nav">
      <a href="javascript:;" data-page="dashboard" class="nav-link active" title="仪表盘">
        <span class="nav-icon" data-icon="nav-dashboard"></span>
        <span class="side-label">仪表盘</span>
      </a>
      <a href="javascript:;" data-page="record" class="nav-link" title="我要记账">
        <span class="nav-icon" data-icon="pencil"></span>
        <span class="side-label">我要记账</span>
      </a>
      <a href="javascript:;" data-page="names" class="nav-link" title="款项名目">
        <span class="nav-icon" data-icon="nav-names"></span>
        <span class="side-label">款项名目</span>
      </a>
      <a href="javascript:;" data-page="tools" class="nav-link" title="支付工具">
        <span class="nav-icon" data-icon="nav-tools"></span>
        <span class="side-label">支付工具</span>
      </a>
      <a href="javascript:;" data-page="accounts" class="nav-link" title="账户管理">
        <span class="nav-icon" data-icon="nav-accounts"></span>
        <span class="side-label">账户管理</span>
      </a>
      <a href="javascript:;" data-page="stats" class="nav-link" title="统计">
        <span class="nav-icon" data-icon="nav-stats"></span>
        <span class="side-label">统计</span>
      </a>
      <a href="javascript:;" data-page="manage" class="nav-link" title="管理">
        <span class="nav-icon" data-icon="nav-manage"></span>
        <span class="side-label">管理</span>
      </a>
      <a href="javascript:;" data-page="settings" class="nav-link" title="设置">
        <span class="nav-icon" data-icon="nav-settings"></span>
        <span class="side-label">设置</span>
      </a>
      <a href="javascript:;" data-page="about" class="nav-link" title="关于">
        <span class="nav-icon" data-icon="nav-about"></span>
        <span class="side-label">关于</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="javascript:;" id="lock-btn" class="nav-link" title="锁定">
        <span class="nav-icon" data-icon="lock"></span>
        <span class="side-label">锁定</span>
      </a>
    </div>
  </aside>

  <div id="sidebar-mask"></div>

  <main id="main">
    <header id="top-bar">
      <button id="menu-toggle" title="菜单" data-icon="menu"></button>
      <span id="header-title">仪表盘</span>
      <span id="header-date"></span>
    </header>

    <div id="pages">
      <section id="page-dashboard" class="page"></section>
      <section id="page-record" class="page" hidden></section>
      <section id="page-names" class="page" hidden></section>
      <section id="page-tools" class="page" hidden></section>
      <section id="page-accounts" class="page" hidden></section>
      <section id="page-stats" class="page" hidden></section>
      <section id="page-manage" class="page" hidden></section>
      <section id="page-settings" class="page" hidden></section>
      <section id="page-about" class="page" hidden></section>
    </div>
  </main>
</div>

<div id="toast" hidden></div>
<div id="modal-mask" hidden>
  <div id="modal" role="dialog"></div>
</div>

<script src="lib/crypto-js.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<script src="lib/solarlunar.min.js"></script>
<script src="js/brand-icons.js"></script>
<script src="js/icons.js"></script>
<script src="js/svg-icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/about-content.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/record.js"></script>
<script src="js/names.js"></script>
<script src="js/tools.js"></script>
<script src="js/accounts.js"></script>
<script src="js/stats.js"></script>
<script src="js/manage.js"></script>
<script src="js/settings.js"></script>
<script src="js/about.js"></script>
<script src="js/app.js"></script>
</body>
</html>
