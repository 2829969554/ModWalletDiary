<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>ModWalletDiary · 钱包日记</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <div id="mask"></div>
  <main id="main">
    <div id="pages">
      <section id="page-about" class="page"></section>
    </div>
  </main>
</div>

<script src="js/svg-icons.js"></script>
<script src="js/about-content.js"></script>
<script>
(function () {
  'use strict';

  const page = document.getElementById('page-about');
  const content = window.AboutContent;

  // 启动协议页靠 #yinsi / #xieyi 定位到对应条款
  function jumpToHash() {
    const hash = (location.hash || '').replace(/^#/, '').toLowerCase();
    if (hash !== 'yinsi' && hash !== 'xieyi') return;
    const target = document.getElementById(hash);
    if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  page.innerHTML = content.hero() + content.privacy('yinsi') + content.terms('xieyi');

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', jumpToHash);
  } else {
    setTimeout(jumpToHash, 0);
  }
  window.addEventListener('hashchange', jumpToHash);
})();
</script>
</body>
</html>
